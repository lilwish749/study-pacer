<script>
/* RETAINED CORE: engine.js — original uploaded algorithm */
/* 评分引擎 —— UMD 风格，纯函数，浏览器和 Node 均可使用 */
/* 6 正向分量(IL/EL/ML/TL/SL/PL) + 1 负向分量(UL) */
(function (root) {
  'use strict';

  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }

  /* ───────── 分区 ───────── */
  var ZONES = [
    { max: 15,  key: 'under',   label: '挑战不足',   color: '#39C5BB' },
    { max: 35,  key: 'low',     label: '低负荷',     color: '#3FB950' },
    { max: 58,  key: 'comfort', label: '舒适区',     color: '#58A6FF' },
    { max: 76,  key: 'optimal', label: '最佳学习区', color: '#D29922' },
    { max: 90,  key: 'high',    label: '高负荷',     color: '#F0883E' },
    { max: 101, key: 'over',    label: '过载',       color: '#F85149' }
  ];

  function zoneOf(score) {
    score = clamp(score, 0, 100);
    for (var i = 0; i < ZONES.length; i++) {
      if (score < ZONES[i].max) return ZONES[i];
    }
    return ZONES[ZONES.length - 1];
  }

  /* 匹配度：66 分为理想点 */
  function matchOf(score) {
    return clamp(100 - Math.abs(score - 66) * 1.8, 0, 100);
  }

  /* ───────── 5 级通俗标识（仅用于界面展示，不参与评分逻辑） ───────── */
  /* 负荷分（0-100）→ 5 级 */
  var LEVELS = [
    { max: 35,  label: '很轻松',   color: '#3FB950' },
    { max: 58,  label: '比较轻松', color: '#58A6FF' },
    { max: 76,  label: '刚刚好',   color: '#D29922' },
    { max: 90,  label: '有点吃力', color: '#F0883E' },
    { max: 101, label: '太吃力',   color: '#F85149' }
  ];
  function levelOf(score) {
    score = clamp(score, 0, 100);
    for (var i = 0; i < LEVELS.length; i++) {
      if (score < LEVELS[i].max) return LEVELS[i];
    }
    return LEVELS[LEVELS.length - 1];
  }
  /* 周负荷 / 日负荷百分比 → 5 级 */
  function levelOfPercent(pct) {
    if (pct < 40)  return { label: '很轻松',   color: '#3FB950' };
    if (pct < 70)  return { label: '比较轻松', color: '#58A6FF' };
    if (pct < 100) return { label: '刚刚好',   color: '#D29922' };
    if (pct < 120) return { label: '有点吃力', color: '#F0883E' };
    return { label: '太吃力', color: '#F85149' };
  }

  /* ───────── 核心评分 ───────── */
  var W = { IL: 0.26, EL: 0.20, ML: 0.18, TL: 0.14, SL: 0.12, PL: 0.10 };

  function scoreActivity(person, activity) {
    person = person || {};
    activity = activity || {};
    var dom = (person.domains && person.domains[activity.domain]) || {};
    var E = dom.experience != null ? dom.experience : 0.3;
    var I = dom.interest != null ? dom.interest : 0.3;

    var D1 = activity.D1 != null ? activity.D1 : 0.5;
    var D2 = activity.D2 != null ? activity.D2 : 0.5;
    var D4 = activity.D4 != null ? activity.D4 : 0.5;
    var D5 = activity.D5 != null ? activity.D5 : 0.5;
    var D6 = activity.D6 != null ? activity.D6 : 0.1;
    var D7 = activity.D7 != null ? activity.D7 : 0.5;

    /* IL —— 内在认知负荷 */
    var IL = D1 * (0.7 + 0.3 * D2) * Math.max(0.15, 1 - 0.6 * E);

    /* EL —— 外在环境负荷（通道不匹配 + 社交偏好差） */
    var ch = person.channel || { read: 0.25, audiovisual: 0.25, hands: 0.25, social: 0.25 };
    var ach = activity.channel || { read: 0.25, audiovisual: 0.25, hands: 0.25, social: 0.25 };
    var dot = 0;
    ['read', 'audiovisual', 'hands', 'social'].forEach(function (k) {
      dot += (ch[k] || 0) * (ach[k] || 0);
    });
    var mismatch = (1 - dot) / 0.75;
    var socialPref = person.socialPref != null ? person.socialPref : 0.1;
    var EL = 0.7 * mismatch + 0.3 * Math.abs(D6 - socialPref);

    /* ML —— 动机负荷 */
    var ML = Math.pow(1 - I, 1.5);

    /* TL —— 时间负荷 */
    var peakTime = person.peakTime || 'morning';
    var chrono = (activity.bestTime && activity.bestTime.indexOf(peakTime) >= 0) ? 1 : 0.5;
    var block = person.block || 45;
    var focusNeedMin = activity.focusNeedMin || 30;
    var ratio = clamp(focusNeedMin / block, 0.5, 2);
    var TL = Math.min(1, (ratio / 2) * (1.5 - 0.5 * chrono));

    /* SL —— 切换负荷（structureNeed 仅在此出现一次） */
    var structureNeed = person.structureNeed != null ? person.structureNeed : 0.5;
    var stuck = person.stuck || 'search';
    var stuckPenalty;
    if (stuck === 'ask') {
      stuckPenalty = D6 < 0.3 ? 1.0 : 0.3;
    } else if (stuck === 'switch') {
      stuckPenalty = 0.6;
    } else {
      stuckPenalty = 0.2; /* search */
    }
    var SL = 0.50 * (1 - structureNeed) + 0.30 * (1 - D7) + 0.20 * stuckPenalty;

    /* PL —— 产出压力负荷 */
    var openLoop = person.openLoop != null ? person.openLoop : 0.5;
    var PL = openLoop * (1 - D5);

    /* UL —— 负向分量：挑战不足（从总分中扣减） */
    var UL = D1 * Math.max(0, E - D2 - 0.15) * 0.8;

    /* 加权原始分 */
    var rawBase = W.IL * IL + W.EL * EL + W.ML * ML + W.TL * TL + W.SL * SL + W.PL * PL;
    var raw = clamp(100 * rawBase - 100 * 0.45 * UL, 0, 100);

    /* 校准 */
    var cal = person.calibration || { k: 1, b: 0 };
    var score = clamp(cal.k * raw + cal.b, 0, 100);

    /* 状态修正：今天的实际负荷 */
    var stateIndex = person.stateIndex != null ? person.stateIndex : 0.6;
    var stateAdj = clamp(score * (1 + (0.5 - stateIndex) * 0.3), 0, 100);

    return {
      score: Math.round(score),
      raw: Math.round(raw * 100) / 100,
      stateAdj: Math.round(stateAdj),
      parts: {
        IL: Math.round(IL * 10000) / 10000,
        EL: Math.round(EL * 10000) / 10000,
        ML: Math.round(ML * 10000) / 10000,
        TL: Math.round(TL * 10000) / 10000,
        SL: Math.round(SL * 10000) / 10000,
        PL: Math.round(PL * 10000) / 10000,
        UL: Math.round(UL * 10000) / 10000
      },
      mismatch: Math.round(mismatch * 10000) / 10000,
      confidence: computeConfidence(person),
      zone: zoneOf(score),
      match: Math.round(matchOf(score)),
      recovery: person.recovery != null ? person.recovery : 0.7,
      weeklyHours: person.weeklyHours || 8
    };
  }

  /* ───────── 置信度 ───────── */
  var DIM_WEIGHTS = { baseline: 0.20, channel: 0.20, pace: 0.15, structure: 0.10, social: 0.20, domains: 0.15 };

  function computeConfidence(person) {
    if (!person) return 0.3;
    var answered = person.answered || {};
    var sum = 0, wsum = 0;
    Object.keys(DIM_WEIGHTS).forEach(function (k) {
      var w = DIM_WEIGHTS[k];
      var c = (k in answered) ? (answered[k] ? 1 : 0.5) : 0.3;
      sum += w * c; wsum += w;
    });
    var conf = wsum > 0 ? sum / wsum : 0.3;
    return Math.round(conf * 100) / 100;
  }

  /* ───────── 主要负荷来源（通俗表述） ───────── */
  var PART_LABELS = {
    IL: '动脑强度',
    EL: '学习方式不合拍',
    ML: '兴趣不够浓',
    TL: '时间对不上',
    SL: '来回切换',
    PL: '要有成果的压力'
  };

  function topContributor(parts) {
    var best = 'IL', bestV = -1;
    Object.keys(PART_LABELS).forEach(function (k) {
      var v = (parts[k] || 0) * W[k];
      if (v > bestV) { bestV = v; best = k; }
    });
    return PART_LABELS[best];
  }

  /* ───────── 处方规则（按序匹配，可多条） ───────── */
  function prescriptions(person, activity, scored) {
    var dom = (person && person.domains && person.domains[activity.domain]) || {};
    var I = dom.interest != null ? dom.interest : 0.3;
    var score = scored.score;
    var mismatch = scored.mismatch;
    var TL = scored.parts.TL;
    var UL = scored.parts.UL || 0;
    var zone = scored.zone.key;

    /* 通道第一名 */
    var ch = person && person.channel || {};
    var topCh = 'hands', topV = -1;
    Object.keys(ch).forEach(function (k) { if (ch[k] > topV) { topV = ch[k]; topCh = k; } });
    var chName = { read: '读图文教程', audiovisual: '看视频听讲解', hands: '自己上手试错', social: '和人讨论请教' }[topCh] || '自己上手试错';

    var out = [];
    if (score > 76 && I > 0.7) {
      out.push({ title: '又爱又累', text: '这件事你很感兴趣但比较费劲，建议拆成每次 45 分钟以内的小块，分两天做。' });
    }
    if (score > 76 && mismatch > 0.5) {
      out.push({ title: '学习方式不合拍', text: '换个更适合你的学法，比如「' + chName + '」。' });
    }
    if (score > 76 && TL > 0.6) {
      out.push({ title: '时间对不上', text: '挪到你脑子最清醒的时段去做，或者一次学久一点、少来回切换。' });
    }
    if (UL > 0.1 || zone === 'under') {
      out.push({ title: '太简单没劲', text: '这个活动对你来说太简单了，建议加点难度、缩短时间，或者换个更进阶的版本 —— 太无聊比太累更容易让人放弃。' });
    }
    if (I < 0.4) {
      out.push({ title: '兴趣不够浓', text: '每次只学 15 分钟，或者把它和你喜欢的事绑在一起（做完它才做喜欢的那件）。' });
    }
    if (score < 35) {
      out.push({ title: '很轻松', text: '这件很省力，可以和其他事排在同一天，或者适当加量。' });
    }
    if (zone === 'optimal') {
      out.push({ title: '难度刚刚好', text: '保持现在的安排就好，这正是你学得又快又好的状态。' });
    }
    if (out.length === 0) {
      out.push({ title: '正常安排', text: '目前的强度可以接受，按自己的节奏来就行。' });
    }
    return out;
  }

  /* ───────── 周负荷 ───────── */
  function weeklyCapacity(person) {
    var p = person || {};
    var weeklyHours = p.weeklyHours || 8;
    var recovery = p.recovery != null ? p.recovery : 0.7;
    return weeklyHours * 50 * (0.7 + 0.6 * recovery);
  }

  /* 同一天内高负荷惩罚：第2个>70 ×1.15，第3个+ ×1.30 */
  function dailyPenalty(list, idx) {
    if (idx === 0) return 1;
    var priorHigh = 0;
    for (var i = 0; i < idx && i < list.length; i++) {
      if (list[i].score > 70) priorHigh++;
    }
    return priorHigh === 0 ? 1 : priorHigh === 1 ? 1.15 : 1.30;
  }

  function weeklyLoadPercent(person, plan, scoredByActivity) {
    var cap = weeklyCapacity(person);
    if (cap <= 0) return { percent: 0, capacity: 0, zone: zoneOf(0) };
    /* 按星期分组 */
    var byDay = {};
    var sum = 0;
    (plan || []).forEach(function (item) {
      var sc = scoredByActivity[item.activityId];
      if (!sc) return;
      var wd = item.weekday != null ? item.weekday : -1; /* -1 = 不限日期 */
      if (wd >= 0) {
        if (!byDay[wd]) byDay[wd] = [];
        byDay[wd].push({ score: sc.score, hours: item.hours || 0 });
      } else {
        sum += sc.score * (item.hours || 0); /* 不限日期不加惩罚 */

<script>

    }
    var done = doneCount || 0;

  var LOAD_ZONES = [
    { max: 70, key: 'low', label: '有余量可加量', color: '#3FB950' },
    { max: 101, key: 'comfort', label: '正常', color: '#58A6FF' },
    { max: 111, key: 'optimal', label: '提示降载', color: '#D29922' },

      var card = pickCard(act, doneCountByAct[act.id]);
      var sc = scored[act.id] || { score: 0, match: 0, zone: { key: 'low' } };
      for (var k = 0; k < sp2.sessions; k++) {

          title: act.name,
          act: act,

          sessions: sp2.sessions,
          score: sc.score,
          match: sc.match,
          zone: sc.zone.key,

    var unplaced = {};
    sessions.forEach(function (s) {

      var peak = person.peakTime;

      if (best && peak && best.indexOf(peak) >= 0) passes.push(function (min) { return best.indexOf(periodOf(min)) >= 0 && periodOf(min) === peak; });
      if (best) passes.push(function (min) { return best.indexOf(periodOf(min)) >= 0; });
      passes.push(function () { return true; });

      for (var p = 0; p < passes.length; p++) {
        var placed = false;
        for (var di = 0; di < days.length && !placed; di++) {

            var start = cands[ci];
            if (!passes[p](start)) continue;
            if (!canPlace(day, s, start, s.activityId, s.sessions)) continue;
            day.blocks.push({
              activityId: s.activityId, title: s.title, act: s.act,
              startMin: start, endMin: start + s.duration, minutes: s.duration,
              step: s.step, stepTotal: s.stepTotal, review: s.review,
              action: s.action, deliverable: s.deliverable, tip: s.tip,
              score: s.score, match: s.match, zone: s.zone, loadFactor: 1
            });
            day.totalMinutes += s.duration;
            placed = true;

          }
        }
        if (placed) break;
      }
      if (!placed) { unplaced[s.activityId] = true; }
    });

    Object.keys(unplaced).forEach(function (id) {
      unscheduled.push({ activityId: id, reason: '本周可用时段不够，排不下' });
    });

    /* 局部改进：最多 2 轮，固定顺序，不引入随机数 */
    for (var round = 0; round < 2; round++) {
      var improved = false;
      for (var di2 = 0; di2 < days.length; di2++) {
        var day2 = days[di2];
        var ordered = day2.blocks.slice().sort(function (a, b) { return a.startMin - b.startMin; });
        for (var bi = 0; bi < ordered.length; bi++) {
          var block = ordered[bi];
          var j0 = computeJ(days, activitiesById);
          /* 临时移除 */
          var pos = day2.blocks.indexOf(block);
          if (pos < 0) continue;
          day2.blocks.splice(pos, 1);
          day2.totalMinutes -= block.minutes;
          var bestJ = j0, bestDay = null, bestStart = null;
          for (var dj = 0; dj < days.length; dj++) {
            var day3 = days[dj];
            if (day3.segs.length === 0) continue;
            var cands3 = candidatesForDay(day3);
            for (var cj = 0; cj < cands3.length; cj++) {
              var st = cands3[cj];
              var sess = { duration: block.minutes, score: block.score };
              if (!canPlace(day3, sess, st, block.activityId, 1)) continue;
              day3.blocks.push({ activityId: block.activityId, title: block.title, act: block.act,
                startMin: st, endMin: st + block.minutes, minutes: block.minutes,
                step: block.step, stepTotal: block.stepTotal, review: block.review,
                action: block.action, deliverable: block.deliverable, tip: block.tip,
                score: block.score, match: block.match, zone: block.zone, loadFactor: 1 });
              day3.totalMinutes += block.minutes;
              var j1 = computeJ(days, activitiesById);
              day3.blocks.pop();
              day3.totalMinutes -= block.minutes;
              if (j1 < bestJ - 1e-9) { bestJ = j1; bestDay = day3; bestStart = st; }
            }
          }
          if (bestDay) {
            bestDay.blocks.push({ activityId: block.activityId, title: block.title, act: block.act,
              startMin: bestStart, endMin: bestStart + block.minutes, minutes: block.minutes,
              step: block.step, stepTotal: block.stepTotal, review: block.review,
              action: block.action, deliverable: block.deliverable, tip: block.tip,
              score: block.score, match: block.match, zone: block.zone, loadFactor: 1 });
            bestDay.totalMinutes += block.minutes;
            improved = true;
          } else {
            day2.blocks.push(block);
            day2.totalMinutes += block.minutes;
          }
        }
      }
      if (!improved) break;
    }

    return finalize({ person: person, plan: plan, scored: scored, weekStartMs: weekStartMs }, days, unscheduled, warnings);
  }

  /* ───────── 输出校验（前端渲染前必须调用） ───────── */
  function validateTimetable(tt) {
    var errs = [];
    if (!tt || !Array.isArray(tt.days)) return ['timetable.days 不是数组'];
    var byActDay = {};
    var weekCount = {};
    tt.days.forEach(function (day) {
      (day.blocks || []).forEach(function (b) {
        weekCount[b.activityId] = (weekCount[b.activityId] || 0) + 1;
      });
    });
    tt.days.forEach(function (day) {
      var seen75 = 0;
      var blocks = (day.blocks || []).slice().sort(function (a, b) { return toMin(a.start) - toMin(b.start); });
      var total = 0;
      blocks.forEach(function (b, i) {
        var s = toMin(b.start), e = toMin(b.end);
        if (!/^\d{2}:\d{2}$/.test(b.start) || !/^\d{2}:\d{2}$/.test(b.end)) {
          errs.push(day.weekday + '「' + b.title + '」时间格式不是 HH:MM');
        }
        if (s == null || e == null || !(e > s)) { errs.push(day.weekday + '「' + b.title + '」结束时间没有晚于开始时间'); }
        else if (b.minutes !== e - s) { errs.push(day.weekday + '「' + b.title + '」minutes 与时间段长度不一致'); }
        if (!(b.step >= 1 && b.step <= b.stepTotal)) { errs.push(day.weekday + '「' + b.title + '」step 不在 1..stepTotal 范围内'); }
        /* H1：同一活动同一天最多 1 次；该活动本周有多块时放宽为 2 次且间隔 ≥ 4 小时 */
        var key = b.activityId + '@' + day.date;
        if (!byActDay[key]) byActDay[key] = [];
        var sameList = byActDay[key];
        var limit = (weekCount[b.activityId] || 1) >= 2 ? 2 : 1;
        if (sameList.length >= limit) {
          errs.push(day.weekday + '同一活动「' + b.title + '」出现了不止 ' + limit + ' 次');
        } else if (sameList.length === 1) {
          var prev = sameList[0];
          var gap = Math.max(s - prev.e, prev.s - e);
          if (gap < 240) { errs.push(day.weekday + '同一活动「' + b.title + '」两次间隔不足 4 小时'); }
        }
        sameList.push({ s: s, e: e });
        /* H2 */
        if (b.score > 75) seen75++;
        /* H4 */
        if (i > 0) {
          var prevEnd = toMin(blocks[i - 1].end);
          if (s - prevEnd < 10) { errs.push(day.weekday + '「' + b.title + '」与上一块间隔不足 10 分钟'); }
        }
        total += b.minutes;
      });
      if (seen75 > 1) { errs.push(day.weekday + '有 ' + seen75 + ' 个高负荷块（score > 75），超过 1 个'); }
      /* H3 */
      if (total > 240) { errs.push(day.weekday + '总时长 ' + total + ' 分钟，超过 240 分钟'); }
    });
    return errs;
  }

  /* ───────── 换时间：给出当天所有合法空槽 ───────── */
  function legalStartsFor(input, date, blockIndex) {
    var tt = input.timetable;
    if (!tt || !Array.isArray(tt.days)) return [];
    var avail = normalizeAvailability(input.availability);
    var person = input.person || {};
    var scored = input.scored || {};
    var day = tt.days.filter(function (d) { return d.date === date; })[0];
    if (!day) return [];
    var block = (day.blocks || [])[blockIndex];
    if (!block) return [];

    var ms = parseDateStr(date);
    var dow = ms == null ? 1 : new Date(ms).getUTCDay();
    var name = WEEKDAY_NAMES[dow];
    /* dow 0=周日、6=周六，其余按工作日处理；segmentsForDate 用 0/6 判定周末 */
    var segIndex = (dow === 0 || dow === 6) ? 6 : 1;
    var r2 = segmentsForDate(avail, segIndex, name);
    if (r2.segs.length === 0) return [];

    var others = (day.blocks || []).filter(function (b, i) { return i !== blockIndex; })
      .map(function (b) { return { startMin: toMin(b.start), endMin: toMin(b.end), score: b.score, activityId: b.activityId }; });
    var sc = scored[block.activityId];
    var sess = { duration: block.minutes, score: sc ? sc.score : block.score };
    var out = [];
    var fakeDay = { blocks: others, totalMinutes: others.reduce(function (s, b) { return s + (b.endMin - b.startMin); }, 0), segs: r2.segs };
    r2.segs.forEach(function (seg) {
      for (var t = seg.start; t + block.minutes <= seg.end; t += 15) {
        if (canPlace(fakeDay, sess, t, block.activityId, 1)) { out.push(toHHMM(t)); }
      }
    });
    return out;
  }

  /* ───────── 移动到新时间：返回新的 timetable ───────── */
  function applyMove(input, date, blockIndex, newStart) {
    var tt = input.timetable;
    if (!tt || !Array.isArray(tt.days)) return tt;
    var day = tt.days.filter(function (d) { return d.date === date; })[0];
    if (!day || !day.blocks[blockIndex]) return tt;
    var block = day.blocks[blockIndex];
    var sm = toMin(newStart);
    if (sm == null) return tt;
    block.start = toHHMM(sm);
    block.end = toHHMM(sm + block.minutes);

    /* 重新算每天都加成 + 周负荷 + 校验 */
    var days = tt.days.map(function (d) {
      var blocks = (d.blocks || []).slice().sort(function (a, b) { return toMin(a.start) - toMin(b.start); });
      blocks.forEach(function (b, i) { b.loadFactor = dayPenalty(blocks, i); });
      return {
        date: d.date, weekday: d.weekday,
        totalMinutes: blocks.reduce(function (s, b) { return s + b.minutes; }, 0),
        blocks: blocks
      };
    });
    tt.days = days;
    var wl = computeWeekLoad(input.person, input.plan, tt, input.scored);
    tt.weekLoad = Math.round(wl.percent);
    tt.weekLoadZone = wl.zone;
    tt.capacity = wl.capacity;
    tt.errors = validateTimetable(tt);
    return tt;
  }

  var API = {
    buildTimetable: buildTimetable,
    validateTimetable: validateTimetable,
    computeWeekLoad: computeWeekLoad,
    legalStartsFor: legalStartsFor,
    applyMove: applyMove,
    periodOf: periodOf,
    WEEKDAY_NAMES: WEEKDAY_NAMES
  };

  if (typeof module !== 'undefined' && module.exports) { module.exports = API; }
  root.LMS = root.LMS || {};
  root.LMS.scheduler = API;
})(typeof window !== 'undefined' ? window : globalThis);

    return null;
  }

  function byKey(key) {
    for (var i = 0; i < CATEGORIES.length; i++) { if (CATEGORIES[i].key === key) return CATEGORIES[i]; }
    return null;
  }
  function axesOf(key) {
    var c = byKey(key);
    if (!c) return null;
    return {
      D1: c.axes.D1, D2: c.axes.D2, focusNeedMin: c.axes.focusNeedMin,
      D4: c.axes.D4, D5: c.axes.D5, D6: c.axes.D6, D7: c.axes.D7,
      channel: { read: c.axes.channel.read, audiovisual: c.axes.channel.audiovisual, hands: c.axes.channel.hands, social: c.axes.channel.social },
      bestTime: c.axes.bestTime.slice()
    };

  function labelOf(key) { var c = byKey(key); return c ? c.label : ''; }

  /* classify(text, forcedKey)
     forcedKey：用户在候选中手动指定的类别（可选）
     返回：{ input, recognized, category, categoryLabel, type, matchedKeywords,
             matchDegree, matchType, suggestions }
     说明：category 为内部键，仅用于程序内部流转，界面层只呈现 categoryLabel。 */
  function classify(text, forcedKey) {
    var name = String(text || '').trim();

    if (forcedKey) {
      var f = byKey(forcedKey);
      if (f) {
        return { input: name, recognized: true, category: f.key, categoryLabel: f.label, type: 'custom',
          matchedKeywords: [], matchDegree: 1, matchType: 'manual', suggestions: [] };
      }
    }
    if (!name) {
      return { input: '', recognized: false, category: null, categoryLabel: null, type: 'custom',
        matchedKeywords: [], matchDegree: 0, matchType: 'empty', suggestions: [] };
    }

    var t = norm(name);

    /* ① 关键词命中（最可靠） / ② 别名、同义词命中（覆盖长尾表达） */
    var hit = matchCore(t);
    if (hit) {
      var base = hit.kind === 'keyword' ? 0.55 : 0.42;
      var step = hit.kind === 'keyword' ? 0.12 : 0.08;
      var cap = hit.kind === 'keyword' ? 0.97 : 0.88;
      var floor = hit.kind === 'keyword' ? 0.50 : 0.40;
      var deg = base + step * hit.hits.length - (hit.rival > 0 ? Math.min(0.20, 0.04 + 0.16 * (hit.rival / hit.hits.length)) : 0);
      return { input: name, recognized: true, category: hit.cat.key, categoryLabel: hit.cat.label,
        type: 'category', matchedKeywords: hit.hits,
        matchDegree: Math.max(floor, Math.min(cap, Math.round(deg * 100) / 100)),
        matchType: hit.kind, suggestions: [] };
    }

    /* ③ 口语化回退：把「今晚想练会儿琴」还原成「练琴」再试一次 */
    var lt = loosen(strip(name));

          type: 'category', matchedKeywords: hit2.hits,
          matchDegree: hit2.kind === 'keyword' ? 0.62 : 0.45,
          matchType: hit2.kind + '-plain', suggestions: [] };
      }
    }

    /* ④ 模糊相似度：不自动归类，给出最接近的候选交用户确认 */
    var ibg = bigrams(t);
    var suggestions = CATEGORIES.map(function (c) {
      return { key: c.key, label: c.label, score: bestScore(ibg, c) };
    }).sort(function (a, b) { return b.score - a.score; })
      .filter(function (s) { return s.score > 0; })
      .slice(0, 3)
      .map(function (s) { return { key: s.key, label: s.label }; });

    return { input: name, recognized: false, category: null, categoryLabel: null, type: 'custom',
      matchedKeywords: [], matchDegree: 0, matchType: 'fuzzy', suggestions: suggestions };
  }

  /* 实时联想：据输入的不完整关键词返回候选补全项
     排序：前缀匹配 > 子串匹配 > 模糊字符相似度 */
  var _index = null;
  function buildIndex() {
    if (_index) return _index;
    var idx = [], seen = {};
    CATEGORIES.forEach(function (cat) {
      cat.keywords.concat(ALIASES[cat.key] || []).forEach(function (term) {
        var t = String(term);
        if (seen[t]) return;
        seen[t] = 1;
        idx.push({ term: t, label: cat.label });
      });
    });
    _index = idx;
    return idx;
  }
  function suggest(query, limit) {
    limit = limit || 8;
    var q = norm(query);
    if (!q) return [];
    /* 除了原样比对，也拿「去掉口语虚词」的版本比对一次，
       这样输入「今晚想练会儿琴」也能联想出「练琴 / 钢琴」 */
    var attempts = [q];
    var lq = loosen(strip(q));
    if (lq && lq !== strip(q)) { attempts.push(lq); }

    var prefix = [], sub = [], fuzzy = [];
    buildIndex().forEach(function (it) {
      var t = norm(it.term);
      var rank = 0, sc = 0;
      attempts.forEach(function (a) {
        if (!a) { return; }
        if (t.indexOf(a) === 0) { if (rank < 2) { rank = 2; sc = 1; } }
        else if (t.indexOf(a) >= 0) { if (rank < 1) { rank = 1; sc = 0.8; } }
        else if (a.length >= 2) {
          var s = dice(bigrams(a), bigrams(t));
          if (s >= 0.34 && rank === 0 && s > sc) { sc = s; }
        }
      });
      if (rank === 2) { prefix.push({ it: it, score: sc }); }
      else if (rank === 1) { sub.push({ it: it, score: sc }); }
      else if (sc > 0) { fuzzy.push({ it: it, score: sc }); }
    });
    prefix.sort(function (a, b) { return a.it.term.length - b.it.term.length; });
    sub.sort(function (a, b) { return a.it.term.length - b.it.term.length; });
    fuzzy.sort(function (a, b) { return b.score - a.score; });
    return prefix.concat(sub, fuzzy).slice(0, limit).map(function (m) {
      return { term: m.it.term, label: m.it.label };
    });
  }

  var API = {
    VERSION: VERSION,
    categories: function () { return CATEGORIES.map(function (c) { return { key: c.key, label: c.label }; }); },
    byKey: byKey,
    labelOf: labelOf,
    axesOf: axesOf,
    classify: classify,
    suggest: suggest
  };

  function dayIndex(date){return Math.round((Date.parse(date+'T00:00:00Z')-Date.parse(WEEK+'T00:00:00Z'))/86400000);}
  function dateLabel(date){return `${Number(date.slice(5,7))} 月 ${Number(date.slice(8))} 日`;} 
  function duration(s){return Math.max(0,minutes(s.end)-minutes(s.start));}
  function amount(mins){const h=Math.floor(mins/60),m=mins%60;return (h?`${h} 小时`:'')+(m?`${h?' ':''}${m} 分钟`:'')||'0 分钟';}
  function interest(id){return state.interests.find(a=>a.id===id);}
  function activityName(a){return a?.short||a?.name||'兴趣练习';}
  function isCustom(s){return !s.interestId;}
  function sessionTitle(s){return isCustom(s)?(s.title||'未命名安排'):activityName(interest(s.interestId));}
  function kindLabel(s){return SCHEDULE_KINDS.find(k=>k.key===s.kind)?.label||'日程';}
  function sessionList(date){return state.sessions.filter(s=>!date||s.date===date).slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));}
  function score(a){return LMS.scoreActivity(state.person,a);}
  function scoreLabel(a){return LMS.levelOf(score(a).score).label;}
  function totalMinutes(){return state.sessions.reduce((n,s)=>n+duration(s),0);}
  function weekLoad(){
    const days=DAY_NAMES.map((name,i)=>({date:dateAt(i),blocks:sessionList(dateAt(i)).map(s=>({activityId:s.interestId,start:s.start,minutes:duration(s),score:s.interestId?score(interest(s.interestId)).score:0}))}));
    return LMS.scheduler.computeWeekLoad(state.person,[],{days},{}).percent;
  }
  function loadTone(){return LMS.levelOfPercent(weekLoad()).label;}
  function toast(message){
    const node=document.getElementById('toast');
    node.innerHTML=`<span>${e(message)}</span><button class="icon-btn" data-action="dismiss-toast" aria-label="关闭提示">${icon('close')}</button>`;
    node.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>node.hidden=true,5500);
  }
  function button(action,label,options={}){return `<button class="btn ${options.primary?'primary':''} ${options.className||''}" data-action="${action}" ${options.id?`data-id="${e(options.id)}"`:''}>${options.icon?icon(options.icon):''}${label}</button>`;}
  function pageHead(title,subtitle,actions=''){return `<div class="page-head"><div><p class="eyebrow" style="margin:0 0 9px">${navItems().find(n=>n.id===page).en}</p><h1 tabindex="-1">${title}</h1><p>${subtitle}</p></div><div class="head-actions">${actions}</div></div>`;}
  function navigation(){
    const markup=navItems().map((n,i)=>`<a href="#${n.id}" ${n.id===page?'aria-current="page"':''}>${icon(n.icon)}<span>${n.name}</span><span class="nav-num">0${i+1}</span></a>`).join('');
    document.getElementById('desktopNav').innerHTML=markup;
    document.getElementById('mobileNavLinks').innerHTML=markup;
    document.getElementById('breadcrumb').textContent=navItems().find(n=>n.id===page).name;
  }
  function render(){
    navigation();({today:renderToday,interests:renderInterests,week:renderWeek,pace:renderPace,admin:renderAdmin}[page])();updateSaveStatus();
  }
  function route(){
    if(!currentUser)return;
    const id=location.hash.slice(1);
    if(id==='main')return;
    if(id==='admin'&&!isAdmin){page='today';toast('管理后台只对管理员开放。');}
    else page=navItems().some(n=>n.id===id)?id:'today';

    main.querySelector('h1')?.focus({preventScroll:true});

  // 2. AUTH — Supabase 邮箱密码认证 + 用户名模拟
  function authEmail(username){return username.toLowerCase()+'@'+AUTH_DOMAIN;}
  function authConfigured(){return !!(SUPABASE_URL&&SUPABASE_ANON_KEY&&window.supabase);}
  function friendlyAuthError(err){
    const msg=String(err?.message||err||'');
    if(/Invalid login credentials/i.test(msg))return '用户名或密码不正确。';
    if(/Email not confirmed/i.test(msg))return '账号还在等待邮箱确认。请先在 Supabase 关闭 Confirm email，再重新注册。';
    if(/already registered|already exists|duplicate key/i.test(msg))return '这个用户名已被占用，换一个试试。';
    if(/password should be at least/i.test(msg))return '密码太短，至少 6 位。';
    if(/Signups not allowed/i.test(msg))return '当前项目关闭了注册，请在 Supabase 允许 Email 注册。';
    if(/rate limit|too many/i.test(msg))return '尝试太频繁，请稍等一会儿再试。';
    if(/Failed to fetch|NetworkError|network/i.test(msg))return '网络连接失败，请检查网络后再试。';
    if(/profiles|login_logs|does not exist|schema/i.test(msg))return '数据库还未初始化，请先在 Supabase 执行 supabase/schema.sql。';
    return msg||'操作失败，请稍后再试。';
  }
  function authGateMarkup(notice=''){
    const missing=!authConfigured();
    return `<div class="auth-card">
      <div style="display:flex;align-items:center;gap:10px"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><strong style="letter-spacing:.2em;font-size:11px">STUDY PACER</strong></div>
      <h1>${authMode==='signup'?'创建你的学习空间':'欢迎回来'}</h1>
      <p class="auth-lead">${authMode==='signup'?'用用户名和密码注册，不需要真实邮箱，也不会发送短信。':'输入用户名和密码，继续今天的学习计划。'}</p>
      ${missing?`<p class="auth-setup">还没有配置 Supabase。请先在 <code>supabase-config.js</code> 中填入 Project URL 与 anon public key，并在 SQL Editor 执行 <code>supabase/schema.sql</code>，然后刷新本页。</p>`:`
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab ${authMode==='login'?'active':''}" data-auth-tab="login" role="tab" aria-selected="${authMode==='login'}">登录</button>
        <button type="button" class="auth-tab ${authMode==='signup'?'active':''}" data-auth-tab="signup" role="tab" aria-selected="${authMode==='signup'}">注册</button>
      </div>
      <form id="authForm" novalidate>
        <div class="field"><label for="authUsername">用户名</label><input id="authUsername" name="username" maxlength="32" autocomplete="username" placeholder="2–32 位字母、数字或 _ -" required><p class="note">仅支持英文、数字、下划线和短横线。</p></div>
        <div class="field"><label for="authPassword">密码</label><input id="authPassword" type="password" name="password" minlength="6" maxlength="72" autocomplete="${authMode==='signup'?'new-password':'current-password'}" placeholder="至少 6 位" required><p class="note">密码由 Supabase 加密保存，本页不保存明文。</p></div>
        <p id="authError" class="field-error" role="alert" hidden></p>
        <p id="authNotice" class="note" role="status" ${notice?'':'hidden'}>${e(notice)}</p>
        <button class="btn primary auth-submit" id="authSubmit" type="submit">${authMode==='signup'?'注册并进入':'登录'}</button>
      </form>
      <p class="auth-foot">登录状态由 Supabase 管理；学习计划数据仍保存在这台设备上。</p>`}
    </div>`;
  }
  function showAuthGate(notice=''){
    const gate=document.getElementById('authGate');
    gate.innerHTML=authGateMarkup(notice);
    gate.hidden=false;
    authBusy=false;
    document.body.style.overflow='hidden';
    setTimeout(()=>document.getElementById('authUsername')?.focus({preventScroll:true}),60);
  }
  function hideAuthGate(){
    document.getElementById('authGate').hidden=true;
    document.body.style.overflow='';
  }
  function setAuthMode(mode){
    if(authBusy||mode===authMode)return;
    authMode=mode;
    showAuthGate();
  }
  function authError(message){
    const node=document.getElementById('authError');
    if(!node)return;
    node.textContent=message;node.hidden=false;
  }
  function setAuthBusy(busy){
    authBusy=busy;
    const submit=document.getElementById('authSubmit');
    if(submit){submit.disabled=busy;submit.textContent=busy?'请稍候…':(authMode==='signup'?'注册并进入':'登录');}
  }
  async function ensureProfile(user,fallback){
    const {data,error}=await authClient.from('profiles').select('id,username,is_admin').eq('id',user.id).maybeSingle();
    if(error)throw new Error('读取资料失败：'+error.message+'。请确认已执行 supabase/schema.sql。');
    if(data)return data;
    const username=(fallback||user.user_metadata?.username||String(user.email||'').split('@')[0]||'user').slice(0,32);
    const {error:insertError}=await authClient.from('profiles').insert({id:user.id,username});
    if(insertError)throw new Error('创建资料失败：'+insertError.message);
    return {id:user.id,username,is_admin:false};
  }
  async function logLogin(user,username){
    const {error}=await authClient.from('login_logs').insert({user_id:user.id,username,user_agent:String(navigator.userAgent||'').slice(0,500)});
    if(error){console.warn('login log failed',error);return false;}
    return true;
  }
  async function signUp(username,password){
    const {data,error}=await authClient.auth.signUp({email:authEmail(username),password,options:{data:{username}}});
    if(error)throw new Error(friendlyAuthError(error));
    if(!data.session)throw new Error('注册已提交，但 Supabase 仍要求邮箱确认。请在 Authentication → Providers → Email 关闭 Confirm email 后重新注册。');
    const user=data.user;
    const {error:profileError}=await authClient.from('profiles').insert({id:user.id,username});
    if(profileError){
      await authClient.auth.signOut();
      throw new Error(profileError.code==='23505'?'这个用户名已被占用，换一个试试。':friendlyAuthError(profileError));
    }
    const profile=await ensureProfile(user,username);
    await logLogin(user,profile.username);
    enterApp(user,profile,'注册成功，先安排今天的一件小事吧。');
  }
  async function signIn(username,password){
    const {data,error}=await authClient.auth.signInWithPassword({email:authEmail(username),password});
    if(error)throw new Error(friendlyAuthError(error));
    const user=data.user,profile=await ensureProfile(user,username);
    enterApp(user,profile);
    const logged=await logLogin(user,profile.username);
    toast(logged?'已登录，欢迎回来。':'已登录，但登录日志写入失败，请确认已执行 schema.sql。');
  }
  async function handleAuthSubmit(form){
    if(authBusy)return;
    if(!authConfigured()){authError('尚未配置 Supabase，请先填写 supabase-config.js。');return;}
    const username=String(form.username.value||'').trim(),password=String(form.password.value||'');
    if(!/^[a-zA-Z0-9_-]{2,32}$/.test(username)){authError('用户名需为 2–32 位字母、数字、下划线或短横线。');return;}
    if(password.length<6){authError('密码至少 6 位。');return;}
    setAuthBusy(true);
    try{
      if(authMode==='signup')await signUp(username,password);
      else await signIn(username,password);
    }catch(err){authError(friendlyAuthError(err));}
    finally{setAuthBusy(false);}
  }
  function paintUser(){
    const nameNode=document.getElementById('userName'),avatar=document.getElementById('userAvatar');
    const logoutBtn=document.getElementById('logoutBtn'),mobileLogout=document.getElementById('mobileLogoutBtn');
    if(currentProfile){
      nameNode.textContent=currentProfile.username;
      avatar.textContent=currentProfile.username.slice(0,1).toUpperCase();
      if(logoutBtn)logoutBtn.hidden=false;
      if(mobileLogout)mobileLogout.hidden=false;
    }else{
      nameNode.textContent='我的学习空间';
      avatar.textContent='P';
      if(logoutBtn)logoutBtn.hidden=true;
      if(mobileLogout)mobileLogout.hidden=true;
    }
  }
  function enterApp(user,profile,message){
    currentUser=user;currentProfile=profile;isAdmin=!!profile.is_admin;adminLogs=null;
    paintUser();hideAuthGate();
    if(location.hash==='#admin'&&!isAdmin)history.replaceState(null,'',location.pathname+location.search);
    route();
    if(message)toast(message);
  }
  async function logout(){
    if(authClient){try{await authClient.auth.signOut();}catch(err){console.warn(err);}}
    currentUser=null;currentProfile=null;isAdmin=false;adminLogs=null;page='today';
    if(location.hash)history.replaceState(null,'',location.pathname+location.search);
    paintUser();showAuthGate('已退出登录。');
  }
  async function startAuth(){
    if(!authConfigured()){showAuthGate();return;}
    authClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    try{
      const {data}=await authClient.auth.getSession();
      if(data.session){
        const profile=await ensureProfile(data.session.user);
        enterApp(data.session.user,profile);
        return;
      }
    }catch(err){console.warn(err);}
    showAuthGate('用用户名和密码登录，或注册一个新账号。');
  }
  // ADMIN — 只有 profiles.is_admin = true 的登录用户能读取登录日志
  function formatLogTime(value){
    const date=new Date(value);
    if(Number.isNaN(date.getTime()))return String(value||'');
    return date.toLocaleString('zh-CN',{hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  function paintAdminRows(){
    const tbody=document.getElementById('adminRows');

    const query=(document.getElementById('adminFilter')?.value||'').trim().toLowerCase();
    const rows=(adminLogs||[]).filter(r=>!query||String(r.username||'').toLowerCase().includes(query));
    const count=document.getElementById('adminCount');
    if(count)count.textContent=rows.length+' 条';
    tbody.innerHTML=rows.length?rows.map(r=>{
      const ua=String(r.user_agent||'未知设备');
      return `<tr><td><strong>${e(r.username)}</strong></td><td>${e(formatLogTime(r.login_at))}</td><td class="ua" title="${e(ua)}">${e(ua.length>90?ua.slice(0,90)+'…':ua)}</td></tr>`;
    }).join(''):'<tr class="admin-empty"><td colspan="3">还没有登录记录。</td></tr>';
  }
  async function loadAdminLogs(force){
    if(!authClient||!isAdmin)return;
    if(adminLogs&&!force){paintAdminRows();return;}
    const tbody=document.getElementById('adminRows');
    if(!tbody)return;
    tbody.innerHTML='<tr class="admin-empty"><td colspan="3">正在读取登录记录…</td></tr>';

    if(error){
      tbody.innerHTML=`<tr class="admin-empty"><td colspan="3" class="field-error">读取失败：${e(error.message)}<br>请确认已执行 schema.sql，并已把当前账号设为管理员。</td></tr>`;

  }
  function renderAdmin(){

      <div class="admin-toolbar"><label for="adminFilter" class="eyebrow" style="margin:0">筛选用户名</label><input id="adminFilter" placeholder="输入用户名的一部分"><span class="spacer"></span><span class="note" id="adminCount">—</span></div>
      <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>用户名</th><th>登录时间</th><th>User Agent</th></tr></thead><tbody id="adminRows"><tr class="admin-empty"><td colspan="3">正在读取登录记录…</td></tr></tbody></table></div>

  // 3. PAGE RENDERERS — Change a page without changing the calculations.

  function taskRow(s){

  function renderInterests(){

    ${weekView==='week'?`<section class="week-grid" aria-label="七天计划">${DAY_NAMES.map((d,i)=>`<div class="day-column ${dateAt(i)===TODAY?'today':''}"><div class="day-heading"><span>${d}</span><strong>${Number(dateAt(i).slice(8))}</strong></div><div class="day-items">${sessionList(dateAt(i)).map(weekBlock).join('')||`<p class="day-rest">${i===6?'给自己留白<br>今天休息':'还没有安排<br>可以慢慢来'}</p>`}</div></div>`).join('')}</section>`:`<div class="day-picker" aria-label="选择日期">${DAY_NAMES.map((d,i)=>`<button data-day="${dateAt(i)}" aria-pressed="${selectedDay===dateAt(i)}">${d}<span>${Number(dateAt(i).slice(8))}</span></button>`).join('')}</div><h2 class="agenda-heading">${dateLabel(selectedDay)} · ${DAY_NAMES[dayIndex(selectedDay)]}</h2>${sessionList(selectedDay).length?sessionList(selectedDay).map(taskRow).join(''):'<div class="empty"><h3>这一天还没有安排</h3><p>可以休息，也可以在生成计划时调整可用时间。</p></div>'}`}

  function weekBlock(s){const a=interest(s.interestId),custom=isCustom(s);const detail=s.done?'✓ 已完成':(custom?`${duration(s)} 分钟 · ${e(kindLabel(s))}`:`${duration(s)} 分钟 · ${e(scoreLabel(a))}`);return `<article class="week-block ${s.done?'done':''} ${custom?'custom':''}"><span class="block-time">${s.start} – ${s.end}</span><h3>${e(sessionTitle(s))}</h3><p>${detail}</p><button class="text-btn" data-action="${custom?'edit-entry':'move-session'}" data-id="${e(s.id)}">${custom?'编辑安排':'调整时间'} ${icon('edit')}</button></article>`;}
  // AI — 细化每周方案由阿里云百炼生成，密钥留在服务端，前端只调用 generate-plan。
  // 方案保存在兴趣的 aiPlan 字段里；采纳后会解析每天时长，自动排进周计划并更新负荷。
  function planMarkup(text){
    return String(text).split(/\r?\n/).map(line=>{
      let t=line.trim();
      if(!t)return '<div class="ai-gap"></div>';
      if(/^周[一二三四五六日]/.test(t)&&t.length<=6)return `<h3 class="ai-day">${e(t)}</h3>`;
      // 去掉百炼输出里的 Markdown 项目符号，让内容更整洁。
      t=t.replace(/^[-*•]\s*/,'');
      return `<p class="ai-line">${e(t)}</p>`;
    }).join('');
  }
  function friendlyPlanError(raw){
    const text=String(raw||'');
    if(/Failed to send a request|Failed to fetch|NetworkError|timeout/i.test(text))return '方案服务暂时连不上，请确认 generate-plan 已部署，并检查网络后再试。';
    if(/invalid.*jwt|jwt expired|401|unauthor/i.test(text))return '登录状态已过期，请退出后重新登录再试。';
    if(/频繁|429|rate limit/i.test(text))return '生成请求太频繁了，请等一会儿再试。';
    return text||'生成失败，请稍后再试。';
  }
  async function readFunctionError(error){
    try{
      const response=error&&error.context;
      if(response&&typeof response.json==='function'){const body=await response.json();if(body&&body.error)return String(body.error);}
    }catch(_){/* 响应不是 JSON，退回原始信息 */}
    return String((error&&error.message)||error||'');
  }
  async function requestPlan(hobby){
    const {data,error}=await authClient.functions.invoke('generate-plan',{body:{hobby}});
    if(error)throw new Error(await readFunctionError(error));
    const text=String((data&&data.plan)||'').trim();
    if(!text)throw new Error('模型没有返回方案内容，请换一个更具体的兴趣再试。');
    return text;
  }
  // 记录/编辑兴趣的表单内生成：结果先暂存在 dialogAiPlan，随表单一起保存。

  // 把 AI 文本按「周一…周日」分段，解析每天的时长（解析不到则默认 30 分钟）。
  function splitPlanByDay(text){
    const dayIndexOf={'一':0,'二':1,'三':2,'四':3,'五':4,'六':5,'日':6,'天':6};
    const days=[];let cur=null;
    String(text).split(/\r?\n/).forEach(line=>{
      const t=line.trim();
      const m=t.match(/^周([一二三四五六日天])/);
      if(m){cur={day:dayIndexOf[m[1]],minutes:30};days.push(cur);return;}
      if(cur){const d=t.match(/时长[^0-9]*(\d{1,3})/);if(d)cur.minutes=Math.min(120,Math.max(15,Number(d[1])));}
    });
    return days.filter(d=>d.day!==undefined);
  }
  // 在当天可用时段里找第一个不冲突的空档（与其他安排至少隔 10 分钟）。
  function findSlot(date,mins){
    const idx=dayIndex(date);
    if(state.availability.restDay.includes(DAY_NAMES[idx]))return null;
    const segs=(idx>=5?state.availability.weekend:state.availability.workday)||[];
    for(const seg of segs){
      let from=minutes(seg.start);
      const limit=minutes(seg.end)-mins;
      while(from<=limit){
        const clash=state.sessions.find(c=>c.date===date&&minutes(c.start)<from+mins+10&&from<minutes(c.end)+10);
        if(!clash)return {start:hhmm(from),end:hhmm(from+mins)};
        from=minutes(clash.end)+10;
      }
    }
    return null;
  }
  // 采纳方案：把每天的安排写进周计划，周负荷随 sessions 自动更新。
  function adoptAiPlan(id){
    const a=interest(id);
    if(!a||!a.aiPlan)return;
    const days=splitPlanByDay(a.aiPlan.text);
    if(!days.length){toast('没有从方案里识别到每天的安排，请重新生成一次。');return;}
    // 清掉这个兴趣之前采纳但未完成的 AI 安排，避免重复堆放。
    state.sessions=state.sessions.filter(s=>!(String(s.id).startsWith('ai-')&&s.interestId===id&&!s.done));
    let added=0,skipped=0;
    days.forEach(d=>{
      const date=dateAt(d.day);
      const dayTotal=state.sessions.filter(s=>s.date===date).reduce((n,s)=>n+duration(s),0);
      if(dayTotal+d.minutes>240){skipped++;return;}
      const slot=findSlot(date,d.minutes);
      if(!slot){skipped++;return;}
      state.sessions.push({id:`ai-${date}-${id}`,date,start:slot.start,end:slot.end,interestId:id,done:false});
      added++;
    });
    saveState();closeDialog();
    if(page==='week')renderWeek();else location.hash='week';
    toast(added?`已把 ${added} 天的安排放进周计划，当前周负荷 ${Math.round(weekLoad())}%。${skipped?`另有 ${skipped} 天因时段不足未排入。`:''}`:'这一周的可用时段放不下这份方案，可以先调整节奏或删减已有安排。');
  }

  function openEntry(id){
    const s=id?state.sessions.find(x=>x.id===id):null,custom=!!s;
    openDialog(custom?'编辑日程':'添加自己的日程',`<form id="entryForm" data-entry="${custom?e(s.id):''}"><div class="dialog-body"><p class="dialog-lead">把课程、上班、项目或任何固定安排直接放进这一周，不用先进兴趣池。</p><div class="field"><label for="entryTitle">安排名称</label><input id="entryTitle" name="title" maxlength="60" placeholder="例如：高等数学课、产品周会、毕业设计" value="${e(custom?s.title:'')}" required autofocus></div><div class="form-pair"><div class="field"><label for="entryKind">类型</label><select id="entryKind" name="kind">${SCHEDULE_KINDS.map(k=>`<option value="${k.key}" ${custom&&s.kind===k.key?'selected':''}>${k.label}</option>`).join('')}</select></div><div class="field"><label for="entryDate">日期</label><select id="entryDate" name="date">${DAY_NAMES.map((name,i)=>`<option value="${dateAt(i)}" ${(custom?s.date:selectedDay)===dateAt(i)?'selected':''}>${name} · ${dateLabel(dateAt(i))}</option>`).join('')}</select></div></div><div class="form-pair"><div class="field"><label for="entryStart">开始时间</label><input type="time" id="entryStart" name="start" value="${custom?s.start:'08:00'}" required></div><div class="field"><label for="entryDuration">持续分钟</label><input type="number" id="entryDuration" name="duration" min="15" max="480" step="5" value="${custom?duration(s):60}" required></div></div><div class="field"><label for="entryNote">备注（可选）</label><textarea id="entryNote" name="note" maxlength="120" placeholder="地点、老师，或者这件事要做到什么程度。">${e(custom?(s.note||''):'')}</textarea></div><p class="note">这类安排按真实时间填写，不受学习可用时段限制；保存时会检查与当天其他安排是否重叠。</p><p id="entryError" class="field-error" role="alert" hidden></p></div><div class="dialog-footer">${custom?button('ask-delete-entry','删除日程',{id:s.id,className:'danger'}):''}${button('close-dialog','取消')}<button class="btn primary" type="submit">${custom?'保存修改':'加入周计划'}</button></div></form>`,'CUSTOM SCHEDULE / 自定义安排');
  }
  function askDeleteEntry(id){
    const s=state.sessions.find(x=>x.id===id);if(!s)return;
    openDialog('删除这条日程',`<div class="dialog-body"><p class="dialog-lead">「${e(sessionTitle(s))}」会从周计划中移除，其他安排不受影响。</p></div>`,button('close-dialog','取消')+button('confirm-delete-entry','删除日程',{id,className:'danger'}),'CUSTOM SCHEDULE / 自定义安排');
  }
  function openGenerate(){
    const active=state.interests.filter(a=>a.active);
    openDialog('把兴趣放进这一周',`<div class="dialog-body"><p class="dialog-lead">按当前可用时间，为 ${active.length} 个兴趣自动安排练习。共计划投入 ${active.reduce((n,a)=>n+a.hours,0)} 小时。</p><div class="summary-detail"><span>工作日</span><strong>07:00–08:00 / 19:00–22:00</strong></div><div class="summary-detail"><span>周六</span><strong>09:00–12:00 / 14:00–21:00</strong></div><div class="summary-detail"><span>周日</span><strong>留白休息</strong></div><p class="notice">这次会重新安排尚未完成的练习。已完成的记录和你添加的日程会保留；放不下的项目会列出来。</p><p class="note">此预览使用固定示例时段。完整的可用时间编辑器属于下一步整合。</p><p id="generateError" class="field-error" role="alert" hidden></p></div>`,button('close-dialog','取消')+button('confirm-generate','生成周计划',{primary:true}),'WEEKLY PLAN');
  }
  function generatePlan(){
    const active=state.interests.filter(a=>a.active),completed=state.sessions.filter(s=>s.done&&!isCustom(s)),fixed=state.sessions.filter(isCustom);
    if(!active.length){showError('generateError','先在兴趣池里选择至少一个要推进的兴趣。');return;}
    const tt=LMS.scheduler.buildTimetable({person:state.person,activities:active,plan:active.map(a=>({activityId:a.id,hours:a.hours})),availability:state.availability,done:[],weekStart:WEEK});
    if(tt.errors.length){showError('generateError','暂时没有生成有效安排，请先调整兴趣投入或学习节奏。');return;}
    // Count existing completed minutes toward each interest's requested time.
    const credits={};completed.forEach(s=>credits[s.interestId]=(credits[s.interestId]||0)+duration(s));
    const items=[];let skipped=0;
    tt.days.forEach(day=>day.blocks.forEach((b,i)=>{
      if(credits[b.activityId]>0){credits[b.activityId]-=b.minutes;return;}
      const s={id:`generated-${day.date}-${i}-${b.activityId}`,date:day.date,start:b.start,end:b.end,interestId:b.activityId,done:false};
      if(completed.some(c=>c.date===s.date&&minutes(c.start)<minutes(s.end)+10&&minutes(s.start)<minutes(c.end)+10)||fixed.some(c=>c.date===s.date&&minutes(c.start)<minutes(s.end)+10&&minutes(s.start)<minutes(c.end)+10)){skipped++;return;}
      items.push(s);
    }));
    state.sessions=[...completed,...fixed,...items];saveState();
    const notPlaced=(tt.unscheduled?.length||0)+skipped;
    const warnings=[...(tt.warnings||[])];
    if(skipped)warnings.push(`${skipped} 次练习与已完成记录或你添加的日程时间太近，暂时没有安排。`);
    if(tt.unscheduled?.length)warnings.push(...tt.unscheduled.map(x=>typeof x==='string'?x:(x.title||interest(x.activityId)?.name||'有练习未能安排')));
    openDialog('这一周已经排好',`<div class="dialog-body"><p class="dialog-lead">已保留 ${completed.length} 次完成记录${fixed.length?`和 ${fixed.length} 条自定义日程`:''}，并安排 ${items.length} 次练习。${notPlaced?`${notPlaced} 项未放进计划。`:'每次练习之间都留了休息间隔。'}</p><p class="note">预计周负荷 ${Math.round(weekLoad())}% · ${loadTone()}</p>${warnings.length?`<p class="eyebrow" style="margin:22px 0 10px">安排说明</p><ul class="about-list">${warnings.map(w=>`<li>${e(w)}</li>`).join('')}</ul>`:''}</div>`,button('go-week','查看周计划',{primary:true}));
    render();
  }
  function showError(id,text){const el=document.getElementById(id);el.textContent=text;el.hidden=false;}
  function startFocus(id){
    const s=state.sessions.find(s=>s.id===id),a=s&&interest(s.interestId);if(!s)return;
    timerSeconds=duration(s)*60;timerSessionId=id;
    const lead=isCustom(s)?(s.note||'按自己的安排完成这段时间，结束后再回来记录。'):(a.cards?.[0]?.action||a.goal);
    openDialog(e(sessionTitle(s)),`<div class="dialog-body"><p class="dialog-lead">${e(lead)}</p><div class="timer" id="timer" role="timer" aria-label="专注剩余时间">${hhmm(timerSeconds/60)}:00</div><p id="timerNote" class="timer-note">准备好了就开始，也可以随时暂停。</p><div class="focus-controls">${button('toggle-timer','开始计时',{primary:true})}${button('reset-timer','重新计时')}</div><p class="note" style="text-align:center">这是当前窗口中的专注计时。关闭对话框会停止计时。</p></div>`,button('close-dialog','先关闭')+button('finish-focus','完成本次安排',{primary:true}),'FOCUS / 只做这一件事');
    paintTimer();
  }
  function paintTimer(){const el=document.getElementById('timer');if(el)el.textContent=String(Math.floor(timerSeconds/60)).padStart(2,'0')+':'+String(timerSeconds%60).padStart(2,'0');}
  function toggleTimer(){
    const btn=modal.querySelector('[data-action="toggle-timer"]');
    if(timerInterval){clearInterval(timerInterval);timerInterval=null;btn.textContent='继续计时';return;}
    if(timerSeconds<=0)return;
    const endAt=Date.now()+timerSeconds*1000;btn.textContent='暂停计时';
    document.getElementById('timerNote').textContent='只需要关注眼前这一步。';
    timerInterval=setInterval(()=>{timerSeconds=Math.max(0,Math.ceil((endAt-Date.now())/1000));paintTimer();if(!timerSeconds){clearInterval(timerInterval);timerInterval=null;btn.textContent='计时结束';document.getElementById('timerNote').textContent='时间到了，可以休息一下，再标记本次完成。';}},250);
  }
  function resetTimer(){clearInterval(timerInterval);timerInterval=null;const s=state.sessions.find(s=>s.id===timerSessionId);timerSeconds=duration(s)*60;paintTimer();modal.querySelector('[data-action="toggle-timer"]').textContent='开始计时';}
  function download(filename,contents,type){const url=URL.createObjectURL(new Blob([contents],{type}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
  function exportCalendar(){
    const esc=text=>String(text).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
    const stamp=(date,time)=>date.replace(/-/g,'')+'T'+time.replace(':','')+'00';
    const now=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    const rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Study Pacer//Design Preview//ZH','CALSCALE:GREGORIAN'];
    sessionList().forEach(s=>rows.push('BEGIN:VEVENT','UID:'+s.id+'@study-pacer-preview','DTSTAMP:'+now,'DTSTART:'+stamp(s.date,s.start),'DTEND:'+stamp(s.date,s.end),'SUMMARY:'+esc(sessionTitle(s)),'DESCRIPTION:'+esc(isCustom(s)?kindLabel(s):'学习配速器预览的示例安排'),'END:VEVENT'));
    rows.push('END:VCALENDAR');download('study-pacer-preview.ics',rows.join('\r\n')+'\r\n','text/calendar;charset=utf-8');toast('已导出示例周计划，时间按日历所在时区使用。');
  }
  function showSettings(){openDialog('设置与备份',`<div class="dialog-body"><p class="dialog-lead">此文件独立运行。修改保存在当前浏览器的预览空间中。</p><div class="form-section"><h3 style="margin-bottom:8px">保存一份预览备份</h3><p class="note" style="margin-bottom:16px">下载你在此预览里记录的兴趣、节奏和安排。</p>${button('export-data','下载预览备份',{icon:'download'})}</div><div class="form-section"><h3 style="margin-bottom:8px">恢复最初的示例</h3><p class="note" style="margin-bottom:16px">只重置此预览。原应用的数据和文件不会改变。</p>${button('ask-reset','重置预览',{className:'danger'})}</div></div>`,button('close-dialog','关闭'));}
  function showAbout(){document.getElementById('mobileNav').close();openDialog('先看方向，再做整合',`<div class="dialog-body"><p class="dialog-lead">这是学习配速器的界面与单文件可行性预览。页面里的兴趣、时间和完成记录都是示例。</p><h3 style="margin-bottom:10px">现在可以体验</h3><ul class="about-list"><li>四个页面之间直接切换。</li><li>添加和编辑兴趣，查看步骤与本地分类建议。</li><li>在周计划里添加课程、上班等自己的固定日程。</li><li>调整学习节奏，生成示例周计划，换时间和勾完成。</li><li>打开专注计时，导出日历和预览备份。</li></ul><h3 style="margin:24px 0 10px">下一步整合</h3><p class="note">完整问卷、旧数据迁移、原计划的版本历史、账号、提醒和社交功能还没有接入此预览。评分和排程是原有算法的估算，不能替代对个人状态的判断。</p><p class="notice">设计参考使用黑白、薰衣草紫和方形控件。预览保留中文界面，使用系统字体，不需要联网。</p></div>`,button('close-dialog','开始体验',{primary:true}),'PREVIEW 01 / 设计讨论稿');}

  // 5. EVENTS — User actions dispatch to the named functions above.
  document.addEventListener('click',event=>{
    const authTab=event.target.closest('[data-auth-tab]');if(authTab){setAuthMode(authTab.dataset.authTab);return;}
    const filter=event.target.closest('[data-filter]');if(filter){interestFilter=filter.dataset.filter;renderInterests();return;}
    const view=event.target.closest('[data-week-view]');if(view){weekView=view.dataset.weekView;renderWeek();return;}
    const day=event.target.closest('[data-day]');if(day){selectedDay=day.dataset.day;renderWeek();return;}
    const target=event.target.closest('[data-action]');if(!target)return;
    const id=target.dataset.id;
    const actions={
      'add-interest':()=>openInterest(), 'edit-interest':()=>openInterest(id),'interest-detail':()=>showInterest(id),
      'add-entry':()=>openEntry(),'edit-entry':()=>openEntry(id),'ask-delete-entry':()=>askDeleteEntry(id),
      'confirm-delete-entry':()=>{state.sessions=state.sessions.filter(s=>!(s.id===id&&isCustom(s)));saveState();closeDialog();render();toast('已删除这条日程。');},
      'close-dialog':closeDialog,'about':showAbout,'settings':()=>{document.getElementById('mobileNav').close();showSettings();},
      'logout':logout,'admin-refresh':()=>loadAdminLogs(true),
      'ai-form-generate':()=>generateForInterestForm(),'ai-detail-generate':()=>generateForInterest(id),'ai-adopt':()=>adoptAiPlan(id),
      'menu':()=>document.getElementById('mobileNav').showModal(),'close-menu':()=>document.getElementById('mobileNav').close(),
      'dismiss-toast':()=>document.getElementById('toast').hidden=true,
      'toggle-active':()=>{const a=interest(id);a.active=!a.active;saveState();closeDialog();render();toast(a.active?'会在下次生成周计划时安排这个兴趣。':'已先存起来，已有安排会继续保留。');},
      'move-session':()=>moveSession(id),'generate':openGenerate,'confirm-generate':generatePlan,
      'go-week':()=>{closeDialog();location.hash='week';if(page==='week')renderWeek();},
      'focus':()=>startFocus(id),'toggle-timer':toggleTimer,'reset-timer':resetTimer,
      'finish-focus':()=>{const s=state.sessions.find(s=>s.id===timerSessionId);if(s)s.done=true;saveState();closeDialog();render();toast('本次练习已完成，给自己一点休息时间。');},
      'export-calendar':exportCalendar,'export-data':()=>{download('study-pacer-preview-backup.json',JSON.stringify(state,null,2),'application/json');toast('预览备份已下载。');},
      'ask-reset':()=>openDialog('重新开始这个预览',`<div class="dialog-body"><p class="dialog-lead">在此预览中的兴趣、修改和完成记录会恢复为最初的示例。其他应用的数据不会改变。</p></div>`,button('close-dialog','取消')+button('confirm-reset','恢复示例',{className:'danger'})),
      'confirm-reset':()=>{state=initialState();query='';saveState();closeDialog();render();toast('已恢复最初的示例。');}
    };
    actions[target.dataset.action]?.();
  });
  document.addEventListener('change',event=>{
    if(event.target.matches('[data-complete]')){const s=state.sessions.find(s=>s.id===event.target.dataset.complete);s.done=event.target.checked;saveState();render();toast(s.done?(isCustom(s)?'已完成这项安排。':'已完成这次练习。'):'已取消完成，可以继续。');}
  });
  document.addEventListener('input',event=>{
    const input=event.target;
    if(input.id==='interestSearch'){query=input.value;renderInterestRows();}
    if(input.id==='interestName'&&!dialogInterestId){const result=InterestClassifier.classify(input.value);const note=document.getElementById('categoryNote');if(result.recognized){document.getElementById('interestCategory').value=result.category;note.textContent=`建议类别：${result.categoryLabel}。可以自行调整。`;}else {document.getElementById('interestCategory').value='';note.textContent='还不能确定类别，请从上方选一个合适的类别。';}}
    if(input.id==='weeklyHours')document.getElementById('weeklyHoursValue').textContent=input.value+' 小时';
    if(input.id==='focusBlock')document.getElementById('focusBlockValue').textContent=input.value+' 分钟';
    if(input.id==='recovery')document.getElementById('recoveryValue').textContent=Math.round(Number(input.value)*100)+'%';
    if(input.id==='adminFilter')paintAdminRows();
  });
  document.addEventListener('submit',event=>{
    const form=event.target;
    if(form.id==='authForm'){event.preventDefault();handleAuthSubmit(form);return;}
    if(!['paceForm','interestForm','moveForm','entryForm'].includes(form.id))return;event.preventDefault();
    const data=new FormData(form);
    if(form.id==='paceForm'){
      Object.assign(state.person,{weeklyHours:Number(data.get('weeklyHours')),block:Number(data.get('block')),peakTime:data.get('peakTime'),recovery:Number(data.get('recovery'))});
      saveState();renderPace();document.getElementById('paceMessage').textContent='已保存，已有安排保留。';toast('节奏已更新。重新生成周计划可应用新的安排偏好。');
    }
    if(form.id==='interestForm'){
      const name=data.get('name').trim(),domain=data.get('category');
      if(!name){showError('interestError','先给这个兴趣起个名字。');return;}
      if(state.interests.some(a=>a.id!==dialogInterestId&&activityName(a).toLowerCase()===name.toLowerCase())){showError('interestError','这个兴趣已经记下了，可以直接编辑原来的条目。');return;}
      const axes=InterestClassifier.axesOf(domain),old=dialogInterestId?interest(dialogInterestId):null;
      if(!axes){showError('interestError','请先选一个合适的类别。');return;}
      const item={...axes,id:old?.id||'interest-'+Date.now().toString(36),name,short:name,domain,categoryLabel:InterestClassifier.byKey(domain).label,goal:data.get('goal').trim()||'先完成一份小练习，再慢慢调整。',hours:Number(data.get('hours')),active:data.has('active'),mark:old?.mark||name.slice(0,2),aiPlan:dialogAiPlan?{hobby:name,text:dialogAiPlan.text}:(old?.aiPlan||null),cards:old?.cards||[{step:1,action:'选一个能在一段时间内完成的小练习',deliverable:'一份初步练习记录',tip:'只选一个小目标。'},{step:2,action:'根据第一次的记录再试一次',deliverable:'一份改进后的练习',tip:'记下一处进步就够了。'}]};
      if(old)state.interests[state.interests.indexOf(old)]=item;else state.interests.push(item);
      dialogAiPlan=null;
      saveState();closeDialog();render();toast(old?'兴趣已更新。新的投入会用于下次排程。':'兴趣已记下，可以在周计划中安排它。');
    }
    if(form.id==='moveForm'){
      const s=state.sessions.find(s=>s.id===form.dataset.session);const date=data.get('date'),start=data.get('start'),min=Number(data.get('duration'));
      if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)||!Number.isInteger(min)||min<15||min>90){showError('moveError','请填写有效时间和 15–90 分钟的时长。');return;}
      const from=minutes(start),to=from+min,index=dayIndex(date),a=interest(s.interestId);
      const segments=(index>=5?state.availability.weekend:state.availability.workday);
      if(state.availability.restDay.includes(DAY_NAMES[index])){showError('moveError','这一天设为休息日，请换一天。');return;}
      if(!segments.some(seg=>from>=minutes(seg.start)&&to<=minutes(seg.end))){showError('moveError',index>=5?'请选择周六 09:00–12:00 或 14:00–21:00 内的时段。':'请选择工作日 07:00–08:00 或 19:00–22:00 内的时段。');return;}
      const others=state.sessions.filter(o=>o.id!==s.id&&o.date===date);
      if(others.some(o=>minutes(o.start)<to+10&&from<minutes(o.end)+10)){showError('moveError','与另一项安排太近了，请至少留出 10 分钟休息。');return;}
      if(others.reduce((n,o)=>n+duration(o),0)+min>240){showError('moveError','这一天已接近 4 小时，请换一天。');return;}
      if(score(a).score>75&&others.some(o=>score(interest(o.interestId)).score>75)){showError('moveError','这一天已有一项高负荷练习，建议换一天。');return;}
      const same=others.filter(o=>o.interestId===s.interestId);
      if(same.length>=2||same.some(o=>Math.max(from-minutes(o.end),minutes(o.start)-to)<240)){showError('moveError','同一兴趣每天最多两次，两次之间至少隔 4 小时。');return;}
      const before={...s};Object.assign(s,{date,start,end:hhmm(to)});
      if(weekLoad()>100){Object.assign(s,before);showError('moveError','调整后会超出当前周负荷容量，请减少时长或调整学习节奏。');return;}
      saveState();closeDialog();render();toast('时间已调整。');
    }
    if(form.id==='entryForm'){
      const editing=form.dataset.entry?state.sessions.find(x=>x.id===form.dataset.entry):null;
      const title=String(data.get('title')||'').trim(),kind=String(data.get('kind')||'other'),date=data.get('date'),start=data.get('start'),min=Number(data.get('duration')),note=String(data.get('note')||'').trim();
      if(!title){showError('entryError','先给这条安排起个名字。');return;}
      if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)||!Number.isInteger(min)||min<15||min>480){showError('entryError','请填写有效时间和 15–480 分钟的时长。');return;}
      const from=minutes(start),to=from+min;
      if(to>1440){showError('entryError','结束时间不能超过当天 24:00，请调整开始时间或时长。');return;}
      const others=state.sessions.filter(o=>o.id!==editing?.id&&o.date===date);
      if(others.some(o=>minutes(o.start)<to&&from<minutes(o.end))){showError('entryError','与这一天已有的安排时间重叠，请换一个时段。');return;}
      const item={...(editing||{}),id:editing?.id||'custom-'+Date.now().toString(36),date,start,end:hhmm(to),title,kind,note,done:editing?.done||false};
      if(editing)state.sessions[state.sessions.indexOf(editing)]=item;else state.sessions.push(item);
      saveState();closeDialog();render();toast(editing?'日程已更新。':'已加入这一周的安排。');
    }
  });
  modal.addEventListener('close',()=>{clearInterval(timerInterval);timerInterval=null;});
  modal.addEventListener('click',event=>{if(event.target===modal){const r=modal.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();}});
  document.getElementById('mobileNav').addEventListener('click',event=>{if(event.target.closest('a'))document.getElementById('mobileNav').close();});
  window.addEventListener('hashchange',route);
  startAuth();
})();

</script>
